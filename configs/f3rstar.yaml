# F3RStar default run config.
# Edit images_path / write_path, then:
#   python demo.py --config configs/f3rstar.yaml

_base_: base.yaml

images_path: /path/to/images
write_path: results/scene

# Method checkpoint (relative to repo root)
path_feedforward: checkpoints/pi3.safetensors
path_retrieval: checkpoints/dino_salad.ckpt
path_tracker: checkpoints/vggsfm_v2_0_0_track_predictor.bin
path_dg: checkpoints/checkpoint-dg+visym.pth

# Enable when you want DenseStar depth sidecars for later dense export.
save_dense_depth: false
