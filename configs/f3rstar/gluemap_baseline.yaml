# GLUEMAP-style baseline knobs for comparison (no F3RStar method defaults).
method: gluemap
camera_model: SIMPLE_PINHOLE
intrinsics_mode: SHARED
use_gt_intrinsics: false
gt_intrinsics_path: null
refine_intrinsics: true
star_ratio: 1.0
adaptive_stop: false
posterior_star_select: false
composite_motion_edges: "off"
cross_star_consistency: false
use_geom_weight: false
seed: 42
pose_thresholds:
- 1
- 3
- 5
- 30
min_free_disk_gib: 5
checkpoint: checkpoints/pi3.safetensors
